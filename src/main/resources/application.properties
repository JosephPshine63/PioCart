spring.application.name=pio-cart

server.port=${PORT:9191}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/piocart_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

api.prefix=/api/v1

# Public URL of the storefront
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
# Allowed CORS origins, comma separated (e.g. http://localhost:3000,https://piocart.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.data.web.pageable.max-page-size=100

# HMAC key for signing JWTs, base64 encoded, at least 256 bits. The default is for local development only.
app.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktcGlvY2FydC1qd3Qtc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uIQ==}
app.jwt.expiration=${JWT_EXPIRATION:PT24H}

# Local secrets (STRIPE_API_KEY...) can live in a gitignored .env next to the pom; real env vars still win.
spring.config.import=optional:file:.env[.properties]
# Stripe secret key (sk_test_... for test mode). Checkout answers 502 while it is empty.
stripe.api.key=${STRIPE_API_KEY:}
stripe.currency=eur
