spring.application.name=pio-cart

server.port=${PORT:9191}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/piocart_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
##(create, update, create-drop, validate)
spring.jpa.hibernate.ddl-auto=update

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

api.prefix=/api/v1

# Public URL of the storefront
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
# Allowed CORS origins, comma separated (e.g. http://localhost:3000,https://piocart.vercel.app)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.data.web.pageable.max-page-size=100
