name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Integration tests start Postgres via Testcontainers (Docker is on the runner)
      - run: ./mvnw -B test
      - name: Build the Docker image
        run: docker build -t piocart-backend .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` prerenders the catalog from the backend, so it runs on Vercel during the deploy instead
      - run: npm run typecheck

  deploy-backend:
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production-backend
      cancel-in-progress: false
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - name: Add deploy SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Rolls the code back to the previous commit if the build fails or the app never turns healthy.
      # Schema changes made by ddl-auto=update are not undone.
      - name: Deploy over SSH
        run: |
          ssh -o StrictHostKeyChecking=accept-new gpr-server@gpr-server '
            set -e
            cd ~/Applications/PioCart
            PREV=$(git rev-parse HEAD)
            git pull --ff-only
            if ! docker compose --profile app up --build -d --wait --wait-timeout 300; then
              git reset --hard "$PREV"
              docker compose --profile app up --build -d
              exit 1
            fi
          '

  # Runs after the backend so the new storefront never talks to an older API; Vercel builds it with the
  # environment variables set in the project (Git deployments are off in frontend/vercel.json).
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production-frontend
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Run from the repository root: the Vercel project's Root Directory is frontend/
      - run: npx --yes vercel@latest deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
      # The build needs the backend, so the SEO check runs against the deployed site.
      # Retried because the edge may still serve the previous deployment for a little while.
      - run: |
          for attempt in 1 2 3 4 5; do
            node frontend/scripts/check-seo.mjs https://pio-cart-psi.vercel.app && exit 0
            echo "Attempt $attempt failed, retrying in 30s"
            sleep 30
          done
          exit 1
