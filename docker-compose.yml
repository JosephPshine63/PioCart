# Local development: `docker compose up -d` starts only Postgres.
# Server: `docker compose --profile app up -d --build` also builds and starts the backend, configured from .env.
services:
  postgres:
    image: postgres:15-alpine
    container_name: piocart_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: piocart_db
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d piocart_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    profiles: ["app"]
    build: .
    container_name: piocart_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/piocart_db
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT24H}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9191/api/v1/categories/all >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Only reachable from the host: Tailscale Funnel publishes it over HTTPS.
    ports:
      - "127.0.0.1:${APP_PORT:-9191}:9191"
    restart: unless-stopped

volumes:
  postgres_data:
